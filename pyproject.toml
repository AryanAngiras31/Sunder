[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunder-cli"
version = "0.1.0"
description = "Agentic zero-trust sandbox testing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aryan S Angiras", email = "aryan.s.angiras31@gmail.com" }
]
dependencies = [
    "pydantic==2.13.4",
    "docker==7.1.0",
    "langgraph==1.2.5",
    "langchain-litellm==0.7.0",
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
    "textual==8.2.8",
    "litellm==1.90.3",
    "langchain-openai==1.3.3",
    "langchain-google-genai==4.2.6",
    "langchain-google-vertexai==3.2.4",
    "langchain-groq==1.1.3",
    "langchain-deepseek==1.1.0",
    "langchain-mistralai==1.1.6",
    "langchain-cohere==0.6.0",
    "langchain-together==0.4.0"
]

[project.scripts]
sunder = "sunder.client.app:main"

[project.optional-dependencies]
dev = [
    "pytest==8.0.0"
]

[project.urls]
Homepage = "https://github.com/AryanAngiras31/Sunder"

[tool.hatch.build.targets.wheel]
packages = ["src/sunder"]